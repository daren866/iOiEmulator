name: Build Android-on-iOS (UTM-SE unsigned IPA)

on:
  push:
    branches: [android4-utm]
  workflow_dispatch:

concurrency:
  group: build-android-utm
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Build UTM-SE unsigned IPA (arm64 + arm64e)
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install host build tools
        run: brew install bison gettext glib gnu-sed pkg-config

      - name: Prepare UTM (clone + trim TARGET_LIST to arm)
        run: bash scripts/trim-utm.sh "$RUNNER_TEMP/UTM"

      - name: Build UTM-SE dependencies (ios-tci, arm64)
        working-directory: ${{ runner.temp }}/UTM
        # patches/sources 会被 build_dependencies.sh 自动 source，提供 QEMU_SRC 等下载地址
        run: ./scripts/build_dependencies.sh -p ios-tci -a arm64

      - name: Archive + package unsigned IPA (iOS-SE, arm64 arm64e)
        working-directory: ${{ runner.temp }}/UTM
        run: |
          ./scripts/build_utm.sh -k iphoneos -s iOS-SE -a "arm64 arm64e" -o UTM
          ./scripts/package.sh ipa-se UTM.xcarchive .

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UTM-SE-Android40-unsigned
          path: ${{ runner.temp }}/UTM/UTM SE.ipa
          if-no-files-found: error

  # 可选：把安卓 4.0 镜像作为独立产物提供（App 首次启动也会再下载一次）
  fetch-images:
    name: Fetch Android 4.0 image packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download + verify + extract
        run: bash scripts/fetch-android-images.sh OUT_DIR="$RUNNER_TEMP/Android40"
      - uses: actions/upload-artifact@v4
        with:
          name: android40-images
          path: ${{ runner.temp }}/Android40
