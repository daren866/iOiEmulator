name: build-goldfish-qemu-ios

# 路线 1（goldfish QEMU → iOS）的构建骨架。
# ⚠️ 实验性 / 未验证：在没有 patches/ios-port/*.patch（针对所选基座的 iOS 移植补丁）之前，
#    configure 或 make 大概率会失败——这是预期的。本工作流用于固化「克隆基座 → 配置 TCG-only
#    → 编译 iOS 静态库」的流程，待 ios-port 补丁落地后自然跑通。
#
# 触发：推到 android4-utm 分支，或手动。
on:
  push:
    branches: [android4-utm]
    paths:
      - 'scripts/fetch-goldfish-qemu.sh'
      - 'patches/ios-port/**'
      - '.github/workflows/build-goldfish-qemu.yml'
  workflow_dispatch:
    inputs:
      qemu_ref:
        description: 'AOSP external/qemu 的 ref（1A=android-4.0.4_r2.1 / 1B=现代标签）'
        required: false
        default: 'android-4.0.4_r2.1'

jobs:
  build-ios-qemu:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          brew install --quiet ninja pkg-config glib pixman || true
          which python3 ninja pkg-config

      - name: 拉取 goldfish QEMU 基座（路线 1）
        env:
          QEMU_REF: ${{ github.event.inputs.qemu_ref || 'android-4.0.4_r2.1' }}
          APPLY_IOS_PORT: ${{ secrets.IOS_PORT_PATCHES_READY || '0' }}
        run: bash scripts/fetch-goldfish-qemu.sh "$PWD/aosp-qemu"

      - name: 配置 TCG-only iOS 静态库（arm-softmmu）
        working-directory: aosp-qemu
        run: |
          # 注意：1A（autotools）与 1B（meson）configure 参数不同，这里给通用骨架。
          # 缺 ios-port 补丁时此步可能失败（预期）。
          if [ -x configure ]; then
            ./configure \
              --target-list=arm-softmmu \
              --disable-kvm --disable-hvf --disable-jit \
              --disable-linux-user --disable-bsd-user \
              --enable-slirp --disable-vhost --disable-vhost-user \
              --disable-modules --disable-install-blobs \
              --static --prefix="$PWD/install" \
              || echo "::warning::configure 失败（预期：待 ios-port 补丁）"
          else
            echo "::warning::未找到 configure（现代 meson 基座需改用 meson 配置）。"
          fi

      - name: 编译
        working-directory: aosp-qemu
        run: |
          if [ -f Makefile ]; then
            make -j"$(sysctl -n hw.ncpu)" || echo "::warning::make 失败（预期：待 ios-port 补丁）"
          fi

      - name: 上传产物（若编译成功）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aosp-qemu-ios
          path: aosp-qemu/install/**
          if-no-files-found: ignore
