name: Build Unsigned IPA and Publish to Releases

# 每次提交自动打包：显式跑在 Apple Silicon macOS runner 上
# （xcodebuild / iphoneos SDK 只有 macOS 提供；公开仓库免费且不限时长）。
#
# 也可被 engine-pipeline.yml 通过 workflow_call 调用，此时会尝试把
# 同一 run 内 ③ 产出的 libqemu-arm.a 链接进 IPA。
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_call:
    inputs:
      engine_artifact:
        description: "同 run 内引擎产物 artifact 名（留空表示不链接引擎）"
        type: string
        required: false
        default: ""
      firmware_artifact:
        description: "同 run 内固件制备库 artifact 名（留空则尝试 firmware-kit-latest Release）"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      engine_artifact:
        description: "引擎产物 artifact 名（留空则尝试 engine-latest Release）"
        type: string
        required: false
        default: ""
      firmware_artifact:
        description: "固件制备库 artifact 名（留空则尝试 firmware-kit-latest Release）"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # 按「分支 + 触发方式」分组：push 自动打包与 engine-pipeline 的 workflow_call
  # 调用互不取消（二者都会在 engine/prebuilt 里接入引擎并产出 IPA）。
  # 同方式内的多次触发仍会取消较早的，避免重复打包。
  group: unsigned-ipa-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  APP_NAME: iOiEmulator
  ARCHIVE_PATH: ${{ github.workspace }}/build/iOiEmulator.xcarchive
  IPA_DIR: ${{ github.workspace }}/build/ipa
  ENGINE_ARTIFACT_DIR: ${{ github.workspace }}/.engine-work/engine-artifact
  # Homebrew 没有 tuist formula，install.tuist.io 也被 CDN 拦成 403，
  # 因此固定版本直连 GitHub Release 下载官方 tuist.zip。
  TUIST_VERSION: '4.215.0'

jobs:
  build:
    name: Build arm64 unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 历史提交经 force-push 改写，runner 增量 checkout 缓存可能把工作树文件
      # 留在旧版（HEAD 已指向新 commit，但个别文件未重新物化）。强制把全部
      # 跟踪文件重新对齐到目标 commit，避免「git log 是新版、运行的却是旧文件」。
      - name: 强制刷新工作树到目标提交
        run: |
          git fetch --force origin "${{ github.sha }}"
          git reset --hard "${{ github.sha }}"
          git clean -fdxq

      - name: 显示 macOS arm64 工具链
        run: |
          sw_vers
          echo "arch      : $(uname -m)"
          xcodebuild -version
          echo "iphoneos  : $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "commit=${GITHUB_SHA}"
          echo "ref=${GITHUB_REF_NAME}"

      - name: 下载同 run 的引擎产物（可选）
        if: ${{ github.event_name != 'push' && inputs.engine_artifact != '' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ inputs.engine_artifact }}
          path: ${{ env.ENGINE_ARTIFACT_DIR }}

      - name: 下载同 run 的固件制备库（可选）
        if: ${{ github.event_name != 'push' && inputs.firmware_artifact != '' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ inputs.firmware_artifact }}
          path: ${{ env.ENGINE_ARTIFACT_DIR }}/firmware-kit

      - name: 准备引擎链接（缺失则照常产出外壳 IPA）
        id: engine
        env:
          ENGINE_ARTIFACT_DIR: ${{ env.ENGINE_ARTIFACT_DIR }}
          ENGINE_RELEASE_TAG: engine-latest
          # 显式转发 token，避免 Releases API 走未认证限流（60/h），
          # 并让 prepare-engine-link.sh 的多镜像下载能拿到稳定源。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prepare-engine-link.sh

      - name: Install Tuist and ldid
        run: |
          set -e
          TUIST_HOME="$HOME/.tuist/bin"
          mkdir -p "$TUIST_HOME"

          BASE="https://github.com/tuist/tuist/releases/download/${TUIST_VERSION}"
          MIRROR="https://v4.gh-proxy.org/${BASE}"
          OK=0
          for URL in "${BASE}/tuist.zip" "${MIRROR}/tuist.zip"; do
            echo "尝试下载：$URL"
            if curl -fL --retry-all-errors --retry 10 --retry-delay 3 \
                 --retry-max-time 600 --connect-timeout 20 --max-time 900 \
                 -o /tmp/tuist.zip "$URL"; then
              OK=1
              break
            fi
          done
          [ "$OK" -eq 1 ] || { echo "::error::Tuist 二进制下载失败"; exit 1; }

          if curl -fsSL --max-time 30 "${BASE}/SHASUMS256.txt" -o /tmp/SHASUMS256.txt; then
            EXPECTED=$(awk '/ tuist\.zip$/ {print $1}' /tmp/SHASUMS256.txt | head -n 1)
            if [ -n "$EXPECTED" ]; then
              echo "${EXPECTED}  /tmp/tuist.zip" | shasum -a 256 -c - \
                || { echo "::error::tuist.zip 校验失败"; exit 1; }
            fi
          else
            echo "::warning::无法获取校验和文件，跳过 SHA256 校验"
          fi
          unzip -tq /tmp/tuist.zip

          unzip -q -o /tmp/tuist.zip -d "$TUIST_HOME"
          chmod +x "$TUIST_HOME/tuist"
          echo "$TUIST_HOME" >> "$GITHUB_PATH"
          export PATH="$TUIST_HOME:$PATH"

          # ldid 用于 TrollStore 需要的 ad-hoc 伪签名；缺失时产出纯未签名 IPA
          brew install ldid || echo "::warning::ldid 不可用，将跳过伪签名"

          tuist version

      - name: Generate Xcode project (Tuist)
        run: |
          export PATH="$HOME/.tuist/bin:$PATH"
          tuist generate --no-open
          test -d "${APP_NAME}.xcworkspace" || { echo "::error::未生成 xcworkspace"; exit 1; }
          echo "engine_linked=${ENGINE_LINKED:-false}"
          ls -la "${APP_NAME}.xcworkspace" "${APP_NAME}.xcodeproj"

      - name: Build unsigned arm64 archive
        run: |
          xcodebuild clean archive \
            -workspace "${APP_NAME}.xcworkspace" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${ARCHIVE_PATH}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            ENABLE_BITCODE=NO \
            SKIP_INSTALL=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Verify archive binary
        run: |
          APP_BUNDLE=$(find "${ARCHIVE_PATH}/Products/Applications" -maxdepth 1 -name '*.app' -type d | head -n 1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::archive 中没有 .app"
            exit 1
          fi
          BIN="$APP_BUNDLE/${APP_NAME}"
          echo "二进制：$BIN"
          lipo -info "$BIN"
          lipo -archs "$BIN" | grep -qw arm64 || { echo "::error::不是 arm64"; exit 1; }
          file "$BIN"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_BUNDLE/Info.plist" || true
          codesign -dv "$BIN" 2>&1 || echo "（预期：未签名）"

      - name: Package IPA
        id: package
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          export IPA_NAME="${APP_NAME}_unsigned_arm64_${SHORT_SHA}_b${GITHUB_RUN_NUMBER}.ipa"
          echo "IPA_NAME=${IPA_NAME}" >> "$GITHUB_ENV"
          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"
          bash scripts/package-ipa.sh

      - name: IPA sanity check
        run: |
          IPA="${IPA_DIR}/${IPA_NAME}"
          test -f "$IPA" || { echo "::error::IPA 不存在"; exit 1; }
          unzip -t "$IPA" | tail -3
          unzip -l "$IPA" | grep -E "Payload/${APP_NAME}\.app/${APP_NAME}$"
          echo "大小：$(du -h "$IPA" | cut -f1)"
          cat "${IPA_DIR}/SHA256SUMS"
          grep -E "^engine_linked" "${IPA_DIR}/build-info.txt" || true

      - name: Upload to Actions Artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa-${{ github.run_number }}
          path: |
            ${{ env.IPA_DIR }}/*.ipa
            ${{ env.IPA_DIR }}/SHA256SUMS
            ${{ env.IPA_DIR }}/build-info.txt
          retention-days: 14
          if-no-files-found: error

      - name: Publish IPA to Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "iOiEmulator 未签名 IPA · build #${{ github.run_number }}"
          prerelease: true
          body: |
            ### 未签名 arm64 IPA（自用 / 侧载）

            | 项 | 值 |
            | --- | --- |
            | Commit | `${{ github.sha }}` |
            | 分支 | `${{ github.ref_name }}` |
            | 触发 | `${{ github.event_name }}` |
            | 文件名 | `${{ steps.package.outputs.ipa_name }}` |
            | Runner | `macos-15`（Apple Silicon） |
            | 引擎 | `${{ steps.engine.outputs.engine_linked == 'true' && 'libqemu-arm 已链接（未经真机验证）' || '未接入 qemu-ios（见 docs/PORTING.md）' }}` |

            > 该 IPA 未做 Apple 签名。可用 TrollStore 直接安装，或用
            > AltStore / SideStore / Sideloadly 用自己的证书重签后安装。
            > 校验值见 `SHA256SUMS`。引擎流水线见 `engine-pipeline.yml`。
          files: |
            ${{ env.IPA_DIR }}/*.ipa
            ${{ env.IPA_DIR }}/SHA256SUMS
            ${{ env.IPA_DIR }}/build-info.txt
