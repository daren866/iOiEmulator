name: "引擎 ① 源码锁定与 iOS 能力清单 (macOS arm64)"

# 本流水线全部阶段都显式跑在 Apple Silicon macOS runner 上。
# QEMU 交叉编译 iOS 依赖 Xcode / xcrun / iphoneos SDK，只有 macOS runner 具备。
on:
  workflow_call:
    outputs:
      manifest_path:
        description: "生成的源码清单路径"
        value: ${{ jobs.source.outputs.manifest_path }}
  workflow_dispatch:

permissions:
  contents: read

env:
  # 所有中间产物集中到一个目录，方便跨 job / 跨 workflow 传递
  WORK: ${{ github.workspace }}/.engine-work

jobs:
  source:
    name: 下载 → SHA256 校验 → 生成清单
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      manifest_path: ${{ steps.manifest.outputs.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 历史提交经 force-push 改写，runner 增量 checkout 缓存可能把工作树文件
      # 留在旧版（HEAD 已指向新 commit，但个别文件未重新物化）。强制把全部
      # 跟踪文件重新对齐到目标 commit，避免「git log 是新版、运行的却是旧文件」。
      - name: 强制刷新工作树到目标提交
        run: |
          git fetch --force origin "${{ github.sha }}"
          git checkout --force "${{ github.sha }}" -- .

      - name: 显示 macOS arm64 工具链
        run: |
          sw_vers
          echo "arch      : $(uname -m)"
          xcodebuild -version
          echo "iphoneos  : $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "sdk path  : $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: 拉取并校验两份锁定源码
        env:
          ENGINE_DEST: ${{ env.WORK }}/tarballs
        run: bash scripts/fetch-engine.sh

      - name: 解包并生成 iOS 宿主能力清单
        id: manifest
        env:
          WORK: ${{ env.WORK }}
        run: bash scripts/engine-source-manifest.sh

      - name: 上传源码包与清单
        uses: actions/upload-artifact@v4
        with:
          name: engine-source
          path: |
            ${{ env.WORK }}/tarballs/
            ${{ env.WORK }}/manifest.json
            ${{ env.WORK }}/qemu-ios-ui.h
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
